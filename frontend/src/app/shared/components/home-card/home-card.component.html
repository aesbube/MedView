<div class="card-overlay">
  <div class="card-content">
    <ng-container [ngSwitch]="uniqueAction">
      <ng-container *ngSwitchCase="'app'">
        <span class="eyebrow">{{ 'home.book.title' | t }}</span>
        <h2 class="headline">{{ 'home.book.subtitle' | t }}</h2>
        <p class="subtext">{{ 'home.book.desc' | t }}</p>
        <div class="card-search">
          <app-appointment-search (focused)="setFocused($event)"></app-appointment-search>
        </div>
      </ng-container>

      <ng-container *ngSwitchCase="'spec'">
        <span class="eyebrow">{{ 'home.specialists.title' | t }}</span>
        <h2 class="headline">{{ 'home.specialists.subtitle' | t }}</h2>
        <p class="subtext">{{ 'home.specialists.desc' | t }}</p>
        <div class="card-search">
          <app-specialist-search (focused)="setFocused($event)"></app-specialist-search>
        </div>
      </ng-container>

      <app-map-search *ngSwitchCase="'map'"></app-map-search>
      <ng-template ngSwitchDefault></ng-template>
    </ng-container>
  </div>
</div>
